name: Publish Release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Publish version and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          node scripts/check-release.mjs --notes > /tmp/release-notes.md
          release_tag="v$release_version"
          if git rev-parse --verify "refs/tags/$release_tag" > /dev/null 2>&1; then
            echo "::error::Tag $release_tag already exists; prepare a new version in a PR."
            exit 1
          fi
          gh release create "$release_tag" --target "$GITHUB_SHA" --title "$release_tag" --notes-file /tmp/release-notes.md
